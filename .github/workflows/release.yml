name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project server --all-groups
      - run: uv run --project server ruff check server/app server/tests server/migrations
      - run: uv run --project server python -m pytest server/tests

  build-browser:
    needs: verify
    runs-on: windows-latest
    env:
      PUBLIC_BASE_URL: ${{ vars.DBKANG_PUBLIC_BASE_URL || 'http://localhost:8000' }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        shell: pwsh
        run: "'RELEASE_VERSION=' + $env:GITHUB_REF_NAME.TrimStart('v') | Out-File -FilePath $env:GITHUB_ENV -Append"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Userscript for the release origin
        run: pnpm --filter @dbkang/userscript build
        env:
          VITE_DBKANG_BASE_URL: ${{ env.PUBLIC_BASE_URL }}
          VITE_DBKANG_TOOLBOX_URL: ${{ env.PUBLIC_BASE_URL }}/toolbox
          DBKANG_VERSION: ${{ env.RELEASE_VERSION }}
      - name: Build portable Chromium, updater, update feed and self-extracting EXE
        run: pnpm --filter @dbkang/browser build:windows
        env:
          DBKANG_VERSION: ${{ env.RELEASE_VERSION }}
          DBKANG_PUBLIC_BASE_URL: ${{ env.PUBLIC_BASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: dbkang-browser-${{ github.ref_name }}
          path: release/browser
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [verify, build-browser]
    runs-on: ubuntu-latest
    env:
      PUBLIC_BASE_URL: ${{ vars.DBKANG_PUBLIC_BASE_URL || 'http://localhost:8000' }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: dbkang-browser-${{ github.ref_name }}
          path: release/browser
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build release assets
        run: pnpm build
        env:
          VITE_DBKANG_BASE_URL: ${{ env.PUBLIC_BASE_URL }}
          VITE_DBKANG_TOOLBOX_URL: ${{ env.PUBLIC_BASE_URL }}/toolbox
          DBKANG_VERSION: ${{ env.RELEASE_VERSION }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            DBKANG_PUBLIC_BASE_URL=${{ env.PUBLIC_BASE_URL }}
            DBKANG_VERSION=${{ env.RELEASE_VERSION }}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            apps/userscript/dist/DBKangToolbox.user.js
            release/browser/DBKangBrowser-Setup-*.exe
            release/browser/SHA256SUMS.txt
